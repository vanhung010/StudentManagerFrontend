<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quên mật khẩu - Student Management System</title>
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/pages/login.css">
<link rel="stylesheet" href="../assets/css/pages/forgot-password.css">
</head>
<body>

<div class="login-page">
    <div class="login-card">

        <div class="login-logo">
            <div class="login-logo-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2 3 7l9 5 9-5-9-5Z"></path>
                    <path d="M3 12l9 5 9-5"></path>
                    <path d="M3 17l9 5 9-5"></path>
                </svg>
            </div>
            <span class="login-logo-text">SMS</span>
        </div>

        <!-- ============ BƯỚC 1: NHẬP TÀI KHOẢN / EMAIL ============ -->
        <div id="stepRequest">
            <h1 class="login-title">Quên mật khẩu?</h1>
            <p class="login-subtitle">Nhập tên đăng nhập hoặc email để nhận hướng dẫn đặt lại mật khẩu</p>

            <form id="forgotForm">
                <div class="form-group">
                    <label class="form-label" for="identifier">Tên đăng nhập hoặc Email</label>
                    <div class="input-with-icon">
                        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2Z"></path>
                            <path d="m22 6-10 7L2 6"></path>
                        </svg>
                        <input type="text" id="identifier" class="form-control input-icon-padding" placeholder="Nhập tên đăng nhập hoặc email">
                    </div>
                </div>

                <div class="form-error hidden" id="forgotError"></div>

                <button type="submit" class="btn btn-primary btn-login" id="btnSendRequest">
                    Gửi yêu cầu
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>
            </form>
        </div>

        <!-- ============ BƯỚC 2: THÔNG BÁO ĐÃ GỬI THÀNH CÔNG ============ -->
        <div id="stepSuccess" class="hidden">
            <div class="success-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2Z"></path>
                    <path d="m22 6-10 7L2 6"></path>
                </svg>
            </div>
            <h1 class="login-title">Kiểm tra email của bạn</h1>
            <p class="login-subtitle">
                Chúng tôi đã gửi hướng dẫn đặt lại mật khẩu đến email liên kết với tài khoản
                <strong id="sentIdentifier"></strong>. Vui lòng kiểm tra hộp thư đến (và mục thư rác).
            </p>

            <button type="button" class="btn btn-secondary btn-login" id="btnResend">
                Gửi lại yêu cầu
            </button>
        </div>

        <a href="login.html" class="back-to-login">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Quay lại đăng nhập
        </a>

    </div>

    <p class="login-footer">STUDENT MANAGER © 2026</p>
</div>

<script src="../assets/js/api.js"></script>
<script src="forgot-password.js"></script>
</body>
</html>
