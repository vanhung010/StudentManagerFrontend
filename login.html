<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập - Student Management System</title>
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="assets/css/pages/login.css">
</head>
<body>

<div class="login-page">
    <div class="login-card">

        <div class="login-logo">
            <div class="login-logo-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2 3 7l9 5 9-5-9-5Z"></path>
                    <path d="M3 12l9 5 9-5"></path>
                    <path d="M3 17l9 5 9-5"></path>
                </svg>
            </div>
            <span class="login-logo-text">SMS</span>
        </div>

        <h1 class="login-title">Đăng nhập hệ thống</h1>
        <p class="login-subtitle">Hệ thống quản lý thông tin sinh viên</p>

        <form id="loginForm">
            <div class="form-group">
                <label class="form-label" for="username">Tên đăng nhập</label>
                <div class="input-with-icon">
                    <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <input type="text" id="username" class="form-control input-icon-padding" placeholder="Nhập tên đăng nhập" autocomplete="username">
                </div>
            </div>

            <div class="form-group">
                <div class="label-row">
                    <label class="form-label" for="password">Mật khẩu</label>
                    <a href="#" class="forgot-link">Quên mật khẩu?</a>
                </div>
                <div class="input-with-icon">
                    <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <input type="password" id="password" class="form-control input-icon-padding input-icon-padding-right" placeholder="Nhập mật khẩu" autocomplete="current-password">
                    <button type="button" class="toggle-password" id="togglePassword" aria-label="Hiện mật khẩu">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </button>
                </div>
            </div>

            <label class="remember-row">
                <input type="checkbox" id="rememberMe">
                <span>Ghi nhớ đăng nhập</span>
            </label>

            <div class="form-error hidden" id="loginError"></div>

            <button type="submit" class="btn btn-primary btn-login">
                Đăng nhập
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>
        </form>

    </div>

    <p class="login-footer">STUDENT MANAGER © 2026</p>
</div>

<script src="../assets/js/api.js"></script>
<script src="login.js"></script>
</body>
</html>
